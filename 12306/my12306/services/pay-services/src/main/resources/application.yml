server:
  port: 9004

spring:
  application:
    name: my12306-pay-service
  datasource:
    # 支付库为普通库（单库单表，不分片）
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/12306_pay?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 274226
  data:
    redis:
      host: 192.168.204.128
      port: 6379
      password: 274226
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos

mybatis-plus:
  configuration:
    # 关闭 SQL 同步日志：原实现让每条语句都同步写标准输出，实测使锁持有中位数 350.2→182.4ms（−47.9%）。
    # 需要看 SQL 时用环境变量 MYBATIS_PLUS_CONFIGURATION_LOG_IMPL 临时覆盖，不要改回本行。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.95,0.99

my12306:
  pay:
    # 模拟渠道收银台地址（真实项目里由支付渠道返回）
    mock-cashier-url: http://127.0.0.1:9004/api/pay-service/pay/mock-cashier
    # 下游通知补偿任务开关（测试环境可关闭）
    notify-compensate-enabled: true
    # 下游通知补偿任务扫描间隔（毫秒）
    notify-compensate-interval-ms: 60000
    # 通知模式：feign（默认，同步串行调 order/ticket）/ mq（投 PAY_SUCCESS，由下游各自消费）
    # 既是回归保险，也是 A/B 压测的开关。默认 feign 保证不改配置时行为与 P1 之前一致。
    notify-mode: ${MY12306_PAY_NOTIFY_MODE:feign}
    # mq 模式下本地消息表的兜底扫描间隔与批量
    notify-message-scan-interval-ms: 10000
    notify-message-scan-batch-size: 100
    # 超过这个重试次数仍发不出去的消息不再自动重发，只计数告警（需人工介入）
    notify-message-max-retry: 10
  rocketmq:
    # mq 模式才会用到；feign 模式下生产者 Bean 不会被创建，也不会去连 broker
    namesrv-addr: ${MY12306_ROCKETMQ_NAMESRV:127.0.0.1:9876}
    producer-group: my12306-pay-notify-producer
