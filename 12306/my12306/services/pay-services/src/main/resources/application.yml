server:
  port: 9004

spring:
  application:
    name: my12306-pay-service
  datasource:
    # 支付库为普通库（单库单表，不分片）
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/12306_pay?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 274226
  data:
    redis:
      host: 192.168.204.128
      port: 6379
      password: 274226
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos

mybatis-plus:
  configuration:
    # 关闭 SQL 同步日志：原实现让每条语句都同步写标准输出，实测使锁持有中位数 350.2→182.4ms（−47.9%）。
    # 需要看 SQL 时用环境变量 MYBATIS_PLUS_CONFIGURATION_LOG_IMPL 临时覆盖，不要改回本行。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.95,0.99

my12306:
  pay:
    # 模拟渠道收银台地址（真实项目里由支付渠道返回）
    mock-cashier-url: http://127.0.0.1:9004/api/pay-service/pay/mock-cashier
    # 下游通知补偿任务开关（测试环境可关闭）
    notify-compensate-enabled: true
    # 下游通知补偿任务扫描间隔（毫秒）
    notify-compensate-interval-ms: 60000
