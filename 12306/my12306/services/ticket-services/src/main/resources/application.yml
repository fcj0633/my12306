server:
  # P2-1：端口可被环境变量覆盖，用于在同一台机器上起第二个 ticket 实例（跨 JVM 验证分布式锁）。
  # 默认值仍是 9002，不设 MY12306_TICKET_PORT 时行为与 P2 之前完全一致。
  port: ${MY12306_TICKET_PORT:9002}

spring:
  application:
    name: my12306-ticket-service
  datasource:
    # 票务库为普通库（基础数据量有限，不分库分表）
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/12306_ticket?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 274226
  data:
    redis:
      host: 192.168.204.128
      port: 6379
      password: 274226
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos

mybatis-plus:
  configuration:
    # 关闭 SQL 同步日志：原实现让每条语句都同步写标准输出，实测使锁持有中位数 350.2→182.4ms（−47.9%）。
    # 需要看 SQL 时用环境变量 MYBATIS_PLUS_CONFIGURATION_LOG_IMPL 临时覆盖，不要改回本行。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.95,0.99
        my12306.purchase.seat-lock.hold: 0.5,0.95,0.99
        my12306.purchase.passenger.remote: 0.5,0.95,0.99
        my12306.purchase.order.remote: 0.5,0.95,0.99

my12306:
  availability:
    token-bucket:
      enabled: ${MY12306_TOKEN_BUCKET_ENABLED:true}
      expire-minutes: ${MY12306_TOKEN_BUCKET_EXPIRE_MINUTES:10}
  ticket:
    # Reconcile only old D4 tickets that have a durable order id; tests/benchmarks can disable it.
    orphan-scan-enabled: ${MY12306_ORPHAN_SCAN_ENABLED:true}
    orphan-scan-interval-ms: ${MY12306_ORPHAN_SCAN_INTERVAL_MS:60000}
    orphan-age-minutes: ${MY12306_ORPHAN_AGE_MINUTES:25}
    orphan-scan-batch-size: ${MY12306_ORPHAN_SCAN_BATCH_SIZE:100}
  # 通知模式：mq（默认，本服务消费 ORDER_PAID）/ feign（本服务不参与 MQ）
  # 三个服务必须使用相同模式；需要回退同步通知时，可统一设置 MY12306_PAY_NOTIFY_MODE=feign。
  pay:
    notify-mode: ${MY12306_PAY_NOTIFY_MODE:mq}
  rocketmq:
    namesrv-addr: ${MY12306_ROCKETMQ_NAMESRV:127.0.0.1:9876}
  # P2-5：雪花 ID 身份显式分配。不同实例必须给不同 workerId（9002→1、9012→2），
  # 否则同机多实例会落到相同的 datacenterId，只剩 32 个 workerId 槽位靠 PID 散列去碰运气。
  snowflake:
    worker-id: ${MY12306_WORKER_ID:1}
    datacenter-id: ${MY12306_DATACENTER_ID:1}
    # 消费者组：与订单侧的 -order-cg 不同，且订阅的 tag 也不同（ORDER_PAID vs PAY_SUCCESS）
    ticket-consumer-group: my12306-pay-notify-ticket-cg
