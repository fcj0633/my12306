server:
  port: 9002

spring:
  application:
    name: my12306-ticket-service
  datasource:
    # 票务库为普通库（基础数据量有限，不分库分表）
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/12306_ticket?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 274226
  data:
    redis:
      host: 192.168.204.128
      port: 6379
      password: 274226
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos

mybatis-plus:
  configuration:
    # 关闭 SQL 同步日志：原实现让每条语句都同步写标准输出，实测使锁持有中位数 350.2→182.4ms（−47.9%）。
    # 需要看 SQL 时用环境变量 MYBATIS_PLUS_CONFIGURATION_LOG_IMPL 临时覆盖，不要改回本行。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.95,0.99
        my12306.purchase.seat-lock.hold: 0.5,0.95,0.99
        my12306.purchase.passenger.remote: 0.5,0.95,0.99
        my12306.purchase.order.remote: 0.5,0.95,0.99

my12306:
  availability:
    token-bucket:
      enabled: ${MY12306_TOKEN_BUCKET_ENABLED:true}
      expire-minutes: ${MY12306_TOKEN_BUCKET_EXPIRE_MINUTES:10}
  ticket:
    # Reconcile only old D4 tickets that have a durable order id; tests/benchmarks can disable it.
    orphan-scan-enabled: ${MY12306_ORPHAN_SCAN_ENABLED:true}
    orphan-scan-interval-ms: ${MY12306_ORPHAN_SCAN_INTERVAL_MS:60000}
    orphan-age-minutes: ${MY12306_ORPHAN_AGE_MINUTES:25}
    orphan-scan-batch-size: ${MY12306_ORPHAN_SCAN_BATCH_SIZE:100}
