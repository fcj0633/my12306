server:
  port: 9003

spring:
  application:
    name: my12306-order-service
  datasource:
    # 最小订单服务：单库单表（后续需要时再演进为分片）
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/12306_order?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 274226
  data:
    redis:
      host: 192.168.204.128
      port: 6379
      password: 274226
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos

mybatis-plus:
  configuration:
    # 关闭 SQL 同步日志：原实现让每条语句都同步写标准输出，实测使锁持有中位数 350.2→182.4ms（−47.9%）。
    # 需要看 SQL 时用环境变量 MYBATIS_PLUS_CONFIGURATION_LOG_IMPL 临时覆盖，不要改回本行。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.95,0.99

my12306:
  order:
    # 超时未支付关单时间（分钟）。【待确认】业务取值：参考项目为 20 分钟，真实 12306 为 30 分钟
    pay-timeout-minutes: 20
    # 延迟队列关单（主通道）：下单成功后投递延迟任务
    delay-close-enabled: true
    # 兜底扫表（补漏）：延迟消息可能丢失，用定时扫描保证"最终一定会关"
    fallback-scan-enabled: true
    fallback-scan-interval-ms: 60000
  # 通知模式：feign（默认，等价于本服务不参与 MQ）/ mq（本服务消费 PAY_SUCCESS 并发出 ORDER_PAID）
  # 默认 feign 保证不改配置时行为与 P1 之前一致，这也是 A/B 对照的基准
  pay:
    notify-mode: ${MY12306_PAY_NOTIFY_MODE:feign}
  rocketmq:
    namesrv-addr: ${MY12306_ROCKETMQ_NAMESRV:127.0.0.1:9876}
    # 消费者组：支付通知扇出到订单。与票务侧的组名不同，这是"一事件多消费者"的基础
    order-consumer-group: my12306-pay-notify-order-cg
    # 生产者组：用于发出 ORDER_PAID
    order-producer-group: my12306-order-notify-producer
